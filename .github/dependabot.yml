# Dependabot : chaque lundi à 6h (heure de Paris)
version: 2
updates:
  - package-ecosystem: github-actions
    directories: ["/", "/.github/actions/*"]
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    commit-message:
      prefix: "ci(deps)"
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: terraform
    directories:
      - /terraform/staging
      - /terraform/production
      - /terraform/monitoring
      - /terraform/modules/vm
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Paris
    commit-message:
      prefix: "chore(deps)"
    groups:
      terraform-providers:
        patterns: ["*"]
