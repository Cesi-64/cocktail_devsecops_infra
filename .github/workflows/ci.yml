# =====================================================================
# CI du dépôt infra : l'Infrastructure as Code est du code, elle se teste.
# =====================================================================
name: CI - Infra

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform fmt / validate
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        stack: [staging, production, monitoring]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: "~1.16.0"
      - name: Format
        run: terraform fmt -check -recursive -diff terraform
      - name: Validate
        run: |
          terraform -chdir=terraform/${{ matrix.stack }} init -backend=false
          terraform -chdir=terraform/${{ matrix.stack }} validate

  checkov:
    name: Checkov (sécurité IaC)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Checkov
        uses: bridgecrewio/checkov-action@c3e106d5f8f4253a6de5110efb41a080f83db294 # v12.3135.0
        with:
          directory: .
          framework: terraform,ansible,github_actions
          output_format: cli,sarif
          output_file_path: console,checkov.sarif
          soft_fail: true   # pédagogique : on publie tout, on corrige au fil de l'eau
      - name: Publier dans GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: checkov.sarif
          category: checkov

  ansible-lint:
    name: ansible-lint
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: ansible-lint
        working-directory: ansible
        run: |
          pipx install ansible-lint
          pipx inject ansible-lint passlib
          ansible-galaxy collection install -r requirements.yml
          ansible-lint playbooks/

  gitleaks:
    name: Secrets (Gitleaks)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Gitleaks (tout l'historique)
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz | tar -xz gitleaks
          ./gitleaks git --redact --verbose .
