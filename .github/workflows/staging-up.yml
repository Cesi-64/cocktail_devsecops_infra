# =====================================================================
# Staging - créer ou mettre à jour la VM (Terraform puis Ansible)
# Appelé par la CI de cocktail-app (push sur release/x.y.z),
# ou lancé à la main depuis l'onglet Actions.
# Idempotent : si le staging existe déjà, rien n'est recréé.
# =====================================================================
name: Staging - Créer

on:
  workflow_call:
    inputs:
      infra_ref:
        description: Version du dépôt infra à utiliser
        type: string
        default: v1
    outputs:
      app_url:
        description: URL du staging
        value: ${{ jobs.up.outputs.app_url }}
  workflow_dispatch:

permissions:
  contents: read

jobs:
  up:
    name: Terraform + Ansible (staging)
    runs-on: ubuntu-24.04
    environment: staging
    permissions:
      contents: read
      id-token: write
    outputs:
      app_url: ${{ steps.tf.outputs.app_url }}
    env:
      ENV_NAME: staging
      # Variables Terraform (organisation GitHub)
      TF_VAR_domain: ${{ vars.DOMAIN }}
      TF_VAR_dns_zone_resource_group: ${{ vars.DNS_ZONE_RESOURCE_GROUP }}
      TF_VAR_ssh_public_key: ${{ vars.SSH_PUBLIC_KEY }}
      TF_VAR_admin_ssh_cidrs: ${{ vars.ADMIN_SSH_CIDRS || '[]' }}
      TF_VAR_shared_resource_group: ${{ vars.TFSTATE_RESOURCE_GROUP }}
      TF_VAR_backup_storage_account_name: ${{ vars.BACKUP_STORAGE_ACCOUNT }}
      # Secrets des agents de supervision
      ACME_EMAIL: ${{ vars.ACME_EMAIL }}
      WAZUH_REGISTRATION_PASSWORD: ${{ secrets.WAZUH_REGISTRATION_PASSWORD }}
      INGEST_PASSWORD: ${{ secrets.INGEST_PASSWORD }}
      BACKUP_AGE_PUBLIC_KEY: ${{ vars.BACKUP_AGE_PUBLIC_KEY }}
    steps:
      - name: Token GitHub App (lecture du dépôt infra)
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: cocktail-infra

      # Appelé depuis cocktail-app : on récupère la version demandée du dépôt
      # infra (infra_ref, "v1" par défaut). Lancé depuis cocktail-infra : la branche courante.
      - name: Checkout du dépôt infra
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/cocktail-infra
          ref: ${{ github.repository == format('{0}/cocktail-infra', github.repository_owner) && github.ref || inputs.infra_ref }}
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false

      - name: Préparer Terraform, Ansible et Azure
        uses: ./.github/actions/setup-infra
        with:
          environment: ${{ env.ENV_NAME }}
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          tfstate-resource-group: ${{ vars.TFSTATE_RESOURCE_GROUP }}
          tfstate-storage-account: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: terraform apply
        id: tf
        run: |
          terraform -chdir=terraform/staging apply -auto-approve
          echo "app_url=$(terraform -chdir=terraform/staging output -raw app_url)" >> "$GITHUB_OUTPUT"

      - name: Ouvrir le SSH pour ce runner
        uses: ./.github/actions/ssh-access
        with:
          environment: staging
          mode: open

      - name: Ansible - préparer la VM (Docker, Alloy, Wazuh)
        run: ansible-playbook -i ansible/inventories/staging ansible/playbooks/provision-app-host.yml

      - name: Refermer le SSH
        if: always()
        uses: ./.github/actions/ssh-access
        with:
          environment: staging
          mode: close

      - name: Résumé
        env:
          APP_URL: ${{ steps.tf.outputs.app_url }}
        run: |
          echo "### Staging prêt : ${APP_URL}" >> "$GITHUB_STEP_SUMMARY"
