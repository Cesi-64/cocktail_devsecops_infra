# =====================================================================
# Déploiement de l'application sur un environnement (staging | production)
# - images référencées PAR DIGEST (Build once, Scan, Promote)
# - signature Cosign VÉRIFIÉE avant tout déploiement
# - en production : l'environnement GitHub "production" impose une approbation
# =====================================================================
name: Déployer l'application

on:
  workflow_call:
    inputs:
      environment:
        description: staging ou production
        type: string
        required: true
      backend_image:
        description: ghcr.io/<orga>/cocktail-app/backend@sha256:...
        type: string
        required: true
      frontend_image:
        description: ghcr.io/<orga>/cocktail-app/frontend@sha256:...
        type: string
        required: true
      version:
        description: Version affichée (ex v1.2.0)
        type: string
        required: true
      infra_ref:
        type: string
        default: v1
    outputs:
      app_url:
        value: ${{ jobs.deploy.outputs.app_url }}

permissions:
  contents: read

jobs:
  deploy:
    name: Déploiement ${{ inputs.environment }} (${{ inputs.version }})
    runs-on: ubuntu-24.04
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.url.outputs.app_url }}
    permissions:
      contents: read
      id-token: write
      packages: read
    outputs:
      app_url: ${{ steps.url.outputs.app_url }}
    env:
      ENV_NAME: ${{ inputs.environment }}
      BACKEND_IMAGE: ${{ inputs.backend_image }}
      FRONTEND_IMAGE: ${{ inputs.frontend_image }}
      APP_VERSION: ${{ inputs.version }}
      ACME_EMAIL: ${{ vars.ACME_EMAIL }}
      # Les secrets de l'application dépendent de l'environnement ciblé
      MARIADB_ROOT_PASSWORD: ${{ inputs.environment == 'production' && secrets.MARIADB_ROOT_PASSWORD_PRODUCTION || secrets.MARIADB_ROOT_PASSWORD_STAGING }}
      MARIADB_PASSWORD: ${{ inputs.environment == 'production' && secrets.MARIADB_PASSWORD_PRODUCTION || secrets.MARIADB_PASSWORD_STAGING }}
      JWT_SECRET: ${{ inputs.environment == 'production' && secrets.JWT_SECRET_PRODUCTION || secrets.JWT_SECRET_STAGING }}
      FIRST_ADMIN_PASSWORD: ${{ inputs.environment == 'production' && secrets.FIRST_ADMIN_PASSWORD_PRODUCTION || secrets.FIRST_ADMIN_PASSWORD_STAGING }}
      # Token éphémère du workflow pour que la VM tire les images privées de GHCR
      GHCR_USER: ${{ github.actor }}
      GHCR_TOKEN: ${{ github.token }}
    steps:
      - name: Contrôler les entrées
        run: |
          case "${ENV_NAME}" in staging|production) ;; *) echo "::error::environnement inconnu"; exit 1;; esac
          for i in "${BACKEND_IMAGE}" "${FRONTEND_IMAGE}"; do
            [[ "${i}" =~ @sha256:[a-f0-9]{64}$ ]] || { echo "::error::${i} n'est pas référencée par digest"; exit 1; }
          done

      - name: Token GitHub App (lecture du dépôt infra)
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.BOT_APP_CLIENT_ID }}
          private-key: ${{ secrets.BOT_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: cocktail-infra

      # Appelé depuis cocktail-app : on récupère la version demandée du dépôt
      # infra (infra_ref, "v1" par défaut). Lancé depuis cocktail-infra : la branche courante.
      - name: Checkout du dépôt infra
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository_owner }}/cocktail-infra
          ref: ${{ github.repository == format('{0}/cocktail-infra', github.repository_owner) && github.ref || inputs.infra_ref }}
          token: ${{ steps.app.outputs.token }}
          persist-credentials: false

      - name: Préparer Terraform, Ansible et Azure
        uses: ./.github/actions/setup-infra
        with:
          environment: ${{ env.ENV_NAME }}
          azure-client-id: ${{ vars.AZURE_CLIENT_ID }}
          azure-tenant-id: ${{ vars.AZURE_TENANT_ID }}
          azure-subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
          tfstate-resource-group: ${{ vars.TFSTATE_RESOURCE_GROUP }}
          tfstate-storage-account: ${{ vars.TFSTATE_STORAGE_ACCOUNT }}
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Connexion à GHCR (lecture des signatures)
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      # On ne déploie QUE des images signées par le pipeline de release de cocktail-app
      - name: Vérifier les signatures Cosign
        run: |
          IDENTITY="^https://github.com/${GITHUB_REPOSITORY_OWNER}/cocktail-app/\.github/workflows/_build-image\.yml@refs/heads/release/.+$"
          for i in "${BACKEND_IMAGE}" "${FRONTEND_IMAGE}"; do
            cosign verify "${i}" \
              --certificate-identity-regexp "${IDENTITY}" \
              --certificate-oidc-issuer https://token.actions.githubusercontent.com > /dev/null
            echo "Signature valide : ${i}"
          done

      - name: Inventaire depuis Terraform
        id: inv
        uses: ./.github/actions/ansible-inventory
        with:
          environment: ${{ inputs.environment }}

      - name: L'environnement doit exister
        if: steps.inv.outputs.exists != 'true'
        run: |
          echo "::error::Aucune VM ${ENV_NAME}. Staging : staging-up. Production : workflow prod-provision."
          exit 1

      - name: URL de l'application
        id: url
        run: echo "app_url=$(terraform -chdir=terraform/${ENV_NAME} output -raw app_url)" >> "$GITHUB_OUTPUT"

      - name: Ouvrir le SSH pour ce runner
        uses: ./.github/actions/ssh-access
        with:
          environment: ${{ inputs.environment }}
          mode: open

      - name: Ansible - déployer
        run: |
          ansible-playbook -i "ansible/inventories/${ENV_NAME}" ansible/playbooks/deploy.yml \
            -e "backend_image=${BACKEND_IMAGE}" \
            -e "frontend_image=${FRONTEND_IMAGE}" \
            -e "app_version=${APP_VERSION}"

      - name: Refermer le SSH
        if: always()
        uses: ./.github/actions/ssh-access
        with:
          environment: ${{ inputs.environment }}
          mode: close

      # -k : le staging utilise un certificat Let's Encrypt de test
      - name: Test de fumée
        env:
          URL: ${{ steps.url.outputs.app_url }}
        run: |
          OPT=$([ "${ENV_NAME}" = staging ] && echo "-k" || echo "")
          for i in $(seq 1 18); do
            if curl -sSf ${OPT} "${URL}/api/" >/dev/null && curl -sSf ${OPT} "${URL}/" >/dev/null; then
              echo "### ${APP_VERSION} en ligne sur ${URL}" >> "$GITHUB_STEP_SUMMARY"; exit 0
            fi
            echo "Attente du certificat / des conteneurs (${i}/18)..."; sleep 10
          done
          echo "::error::${URL} ne répond pas"; exit 1
