[defaults]
roles_path = ./roles
# Les VM sont recréées régulièrement (staging, reprise après sinistre) :
# leur clé d'hôte SSH change, on ne la vérifie donc pas.
host_key_checking = False
interpreter_python = auto_silent
callback_result_format = yaml
retry_files_enabled = False
forks = 5
timeout = 30

[ssh_connection]
pipelining = True
retries = 5
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o ServerAliveInterval=30
