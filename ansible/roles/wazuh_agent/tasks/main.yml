---
- name: Vérifier les variables obligatoires
  ansible.builtin.assert:
    that:
      - wazuh_registration_password | length > 0
    fail_msg: "Secret WAZUH_REGISTRATION_PASSWORD manquant"
    quiet: true

- name: Clé GPG du dépôt Wazuh
  ansible.builtin.get_url:
    url: https://packages.wazuh.com/key/GPG-KEY-WAZUH
    dest: /etc/apt/keyrings/wazuh.asc
    mode: "0644"

- name: Dépôt APT Wazuh
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/wazuh.asc] https://packages.wazuh.com/4.x/apt/ stable main"
    filename: wazuh
    state: present

- name: Installer l'agent (inscription automatique auprès du manager)
  ansible.builtin.apt:
    name: "wazuh-agent={{ wazuh_version }}-1"
    state: present
    update_cache: true
  environment:
    WAZUH_MANAGER: "{{ wazuh_manager_address }}"
    WAZUH_REGISTRATION_PASSWORD: "{{ wazuh_registration_password }}"
    WAZUH_AGENT_NAME: "{{ wazuh_agent_name }}"
    WAZUH_AGENT_GROUP: default

- name: Bloquer la version de l'agent (pas de mise à jour non maîtrisée)
  ansible.builtin.dpkg_selections:
    name: wazuh-agent
    selection: hold

- name: Forcer une nouvelle inscription (manager reconstruit)
  when: wazuh_force_enroll | bool
  block:
    - name: Supprimer l'ancienne clé d'agent
      ansible.builtin.copy:
        dest: /var/ossec/etc/client.keys
        content: ""
        owner: root
        group: wazuh
        mode: "0640"

    - name: Inscription auprès du nouveau manager
      ansible.builtin.command: >-
        /var/ossec/bin/agent-auth -m {{ wazuh_manager_address }}
        -P {{ wazuh_registration_password }} -A {{ wazuh_agent_name }}
      no_log: true
      changed_when: true

- name: Agent démarré
  ansible.builtin.systemd_service:
    name: wazuh-agent
    state: "{{ 'restarted' if (wazuh_force_enroll | bool) else 'started' }}"
    enabled: true
    daemon_reload: true
